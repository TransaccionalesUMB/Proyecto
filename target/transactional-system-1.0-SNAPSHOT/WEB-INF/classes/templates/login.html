<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StockMaster</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Estilo inspirado en SAP BTP */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            max-width: 400px;
            width: 100%;
        }
        
        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .card-header {
            background-color: #0f1d2d;
            color: white;
            text-align: center;
            padding: 25px 15px;
            border-bottom: none;
        }
        
        .card-header h3 {
            margin: 0;
            font-weight: 500;
        }
        
        .card-body {
            padding: 30px;
        }
        
        .form-control {
            border-radius: 4px;
            padding: 12px 15px;
            border: 1px solid #e0e6ed;
            background-color: #f8fafc;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: #0070f2;
            box-shadow: 0 0 0 0.2rem rgba(0, 112, 242, 0.25);
            background-color: #ffffff;
        }
        
        .form-label {
            color: #0f1d2d;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .btn-primary {
            background-color: #0070f2;
            border-color: #0070f2;
            padding: 12px;
            font-weight: 500;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            background-color: #0051b4;
            border-color: #0051b4;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 112, 242, 0.3);
        }
        
        .login-icon {
            font-size: 3rem;
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .input-group-text {
            background-color: #f8fafc;
            border: 1px solid #e0e6ed;
            border-right: none;
        }
        
        .alert {
            border-radius: 4px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-boxes-stacked login-icon"></i>
                <h3>StockMaster</h3>
                <p class="text-light mb-0">Sistema de Gestión de Inventario</p>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">Error</span>
                </div>
                <div th:if="${message}" class="alert alert-success" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${message}">Mensaje</span>
                </div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-4">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="usuario@ejemplo.com" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center mt-3 text-muted">
            <small>&copy; 2025 StockMaster. Todos los derechos reservados.</small>
        </div>
    </div>
    <!-- Scripts básicos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
