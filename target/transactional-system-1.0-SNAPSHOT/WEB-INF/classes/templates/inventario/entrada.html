<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/corporate-header :: corporate-head('Entrada de Inventario')"></head>
<body>
    <div th:replace="fragments/navigation :: main-nav"></div>
    
    <div class="container mt-4">
        <div class="corporate-dashboard-header animate-fade-in-up">
            <h1><i class="fas fa-plus-circle me-2"></i>Entrada de Stock</h1>
            <p>Registre la entrada de productos al inventario de manera eficiente.</p>
        </div>
        
        <!-- Alertas -->
        <div th:if="${mensaje}" class="corporate-alert corporate-alert-success alert-animated">
            <i class="fas fa-check-circle corporate-icon"></i>
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${error}" class="corporate-alert corporate-alert-danger alert-animated">
            <i class="fas fa-times-circle corporate-icon"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div class="corporate-card animate-fade-in-up">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-clipboard-list corporate-icon"></i> Formulario de Entrada</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/inventario/entrada}" method="post">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="idProducto">Producto <span class="text-danger">*</span></label>
                            <select id="idProducto" name="idProducto" class="form-control" required>
                                <option value="">Seleccione un producto</option>
                                <option th:each="producto : ${productos}" th:value="${producto.id}" th:text="${producto.name}"></option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="cantidad">Cantidad <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="cantidad" name="cantidad" min="1" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="idBodega">Bodega <span class="text-danger">*</span></label>
                            <select id="idBodega" name="idBodega" class="form-control" required>
                                <option value="">Seleccione una bodega</option>
                                <option th:each="bodega : ${bodegas}" th:value="${bodega.id}" th:text="${bodega.nombre}"></option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="idUbicacion">Ubicación</label>
                            <select id="idUbicacion" name="idUbicacion" class="form-control">
                                <option value="">Seleccione una ubicación</option>
                                <!-- Las opciones se cargarán dinámicamente con JavaScript -->
                            </select>
                            <small class="form-text text-muted">Opcional. Seleccione primero una bodega.</small>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="numeroLote">Número de Lote</label>
                            <input type="text" class="form-control" id="numeroLote" name="numeroLote">
                            <small class="form-text text-muted">Opcional. Identificador único del lote.</small>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="fechaCaducidad">Fecha de Caducidad</label>
                            <input type="date" class="form-control" id="fechaCaducidad" name="fechaCaducidad">
                            <small class="form-text text-muted">Opcional. Fecha en que el producto caduca.</small>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="confirmarEntrada">
                            <label class="form-check-label" for="confirmarEntrada">
                                Confirmo que los datos ingresados son correctos
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group text-right">
                        <button type="submit" class="btn btn-corporate-primary btn-animate"><i class="fas fa-save"></i> Guardar</button>
                        <a th:href="@{/inventario}" class="btn btn-corporate-secondary btn-animate"><i class="fas fa-arrow-left"></i> Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Pie de página -->
    <footer th:replace="fragments/corporate-header :: corporate-footer"></footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script th:src="@{/css/animations.js}"></script>
    
    <script>
        $(document).ready(function() {
            // Inicializar animaciones
            initializeAnimations();
            
            // Habilitar/deshabilitar botón de envío según checkbox
            $('#confirmarEntrada').change(function() {
                if(this.checked) {
                    $('#btnSubmit').removeClass('disabled').addClass('btn-animate');
                } else {
                    $('#btnSubmit').addClass('disabled').removeClass('btn-animate');
                }
            });
            
            // Cargar ubicaciones cuando se selecciona una bodega
            $('#idBodega').change(function() {
                const bodegaId = $(this).val();
                if (bodegaId) {
                    // Mostrar indicador de carga
                    const ubicacionSelect = $('#idUbicacion');
                    ubicacionSelect.empty();
                    ubicacionSelect.append('<option value="">Cargando ubicaciones...</option>');
                    
                    $.getJSON('/inventario/api/ubicaciones/' + bodegaId, function(data) {
                        ubicacionSelect.empty();
                        ubicacionSelect.append('<option value="">Seleccione una ubicación</option>');
                        
                        $.each(data, function(index, ubicacion) {
                            ubicacionSelect.append('<option value="' + ubicacion.id + '">' + ubicacion.codigoUbicacion + '</option>');
                        });
                        
                        ubicacionSelect.prop('disabled', false);
                        
                        // Agregar efecto de animación
                        ubicacionSelect.addClass('animate-pulse').delay(500).queue(function(){
                            $(this).removeClass('animate-pulse').dequeue();
                        });
                    }).fail(function() {
                        // Manejar error
                        ubicacionSelect.empty();
                        ubicacionSelect.append('<option value="">Error al cargar ubicaciones</option>');
                    });
                } else {
                    $('#idUbicacion').empty().prop('disabled', true);
                    $('#idUbicacion').append('<option value="">Seleccione una ubicación</option>');
                }
            });
            
            // Función para inicializar animaciones
            function initializeAnimations() {
                // Animar campos de formulario al recibir foco
                $('input, select, textarea').focus(function() {
                    $(this).addClass('input-focus-effect');
                }).blur(function() {
                    $(this).removeClass('input-focus-effect');
                });
                
                // Inicializar tooltips si existen
                if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
                    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                    tooltipTriggerList.map(function (tooltipTriggerEl) {
                        return new bootstrap.Tooltip(tooltipTriggerEl);
                    });
                }
            }
        });
    </script>
</body>
</html>
