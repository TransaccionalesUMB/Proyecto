<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencia de Stock - StockMaster</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
</head>
<body>
    <div th:replace="fragments/header :: header"></div>
    
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <h2><i class="fas fa-exchange-alt"></i> Transferencia de Stock</h2>
                <p class="text-muted">Transfiera productos entre bodegas y ubicaciones.</p>
            </div>
        </div>
        
        <!-- Alertas -->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        
        <div class="card">
            <div class="card-body">
                <form th:action="@{/inventario/transferencia}" method="post">
                    <div class="form-row">
                        <div class="form-group col-md-12">
                            <label for="idProducto">Producto <span class="text-danger">*</span></label>
                            <select id="idProducto" name="idProducto" class="form-control" required>
                                <option value="">Seleccione un producto</option>
                                <option th:each="producto : ${productos}" th:value="${producto.id}" th:text="${producto.name}"></option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="cantidad">Cantidad <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="cantidad" name="cantidad" min="1" required>
                            <small id="stockDisponible" class="form-text text-muted">Stock disponible en origen: <span>-</span></small>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="idLote">Lote</label>
                            <select id="idLote" name="idLote" class="form-control">
                                <option value="">Seleccione un lote</option>
                                <!-- Las opciones se cargarán dinámicamente con JavaScript -->
                            </select>
                            <small class="form-text text-muted">Opcional. Seleccione primero un producto.</small>
                        </div>
                    </div>
                    
                    <hr>
                    <h5 class="mb-3">Origen</h5>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="idBodegaOrigen">Bodega de Origen <span class="text-danger">*</span></label>
                            <select id="idBodegaOrigen" name="idBodegaOrigen" class="form-control" required>
                                <option value="">Seleccione una bodega</option>
                                <option th:each="bodega : ${bodegas}" th:value="${bodega.id}" th:text="${bodega.nombre}"></option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="idUbicacionOrigen">Ubicación de Origen</label>
                            <select id="idUbicacionOrigen" name="idUbicacionOrigen" class="form-control">
                                <option value="">Seleccione una ubicación</option>
                                <!-- Las opciones se cargarán dinámicamente con JavaScript -->
                            </select>
                            <small class="form-text text-muted">Opcional. Seleccione primero una bodega.</small>
                        </div>
                    </div>
                    
                    <hr>
                    <h5 class="mb-3">Destino</h5>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="idBodegaDestino">Bodega de Destino <span class="text-danger">*</span></label>
                            <select id="idBodegaDestino" name="idBodegaDestino" class="form-control" required>
                                <option value="">Seleccione una bodega</option>
                                <option th:each="bodega : ${bodegas}" th:value="${bodega.id}" th:text="${bodega.nombre}"></option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="idUbicacionDestino">Ubicación de Destino</label>
                            <select id="idUbicacionDestino" name="idUbicacionDestino" class="form-control">
                                <option value="">Seleccione una ubicación</option>
                                <!-- Las opciones se cargarán dinámicamente con JavaScript -->
                            </select>
                            <small class="form-text text-muted">Opcional. Seleccione primero una bodega.</small>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="confirmarTransferencia">
                            <label class="form-check-label" for="confirmarTransferencia">
                                Confirmo que los datos ingresados son correctos
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group text-right">
                        <a href="/inventario" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-info" id="btnSubmit" disabled>Realizar Transferencia</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <div th:replace="fragments/footer :: footer"></div>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // Habilitar/deshabilitar botón de envío según checkbox
            $('#confirmarTransferencia').change(function() {
                $('#btnSubmit').prop('disabled', !this.checked);
            });
            
            // Cargar ubicaciones cuando se selecciona una bodega de origen
            $('#idBodegaOrigen').change(function() {
                const bodegaId = $(this).val();
                if (bodegaId) {
                    $.getJSON('/inventario/api/ubicaciones/' + bodegaId, function(data) {
                        const ubicacionSelect = $('#idUbicacionOrigen');
                        ubicacionSelect.empty();
                        ubicacionSelect.append('<option value="">Seleccione una ubicación</option>');
                        
                        $.each(data, function(index, ubicacion) {
                            ubicacionSelect.append('<option value="' + ubicacion.id + '">' + ubicacion.codigoUbicacion + '</option>');
                        });
                        
                        ubicacionSelect.prop('disabled', false);
                    });
                } else {
                    $('#idUbicacionOrigen').empty().prop('disabled', true);
                    $('#idUbicacionOrigen').append('<option value="">Seleccione una ubicación</option>');
                }
                
                // Actualizar stock disponible
                actualizarStockDisponible();
            });
            
            // Cargar ubicaciones cuando se selecciona una bodega de destino
            $('#idBodegaDestino').change(function() {
                const bodegaId = $(this).val();
                if (bodegaId) {
                    $.getJSON('/inventario/api/ubicaciones/' + bodegaId, function(data) {
                        const ubicacionSelect = $('#idUbicacionDestino');
                        ubicacionSelect.empty();
                        ubicacionSelect.append('<option value="">Seleccione una ubicación</option>');
                        
                        $.each(data, function(index, ubicacion) {
                            ubicacionSelect.append('<option value="' + ubicacion.id + '">' + ubicacion.codigoUbicacion + '</option>');
                        });
                        
                        ubicacionSelect.prop('disabled', false);
                    });
                } else {
                    $('#idUbicacionDestino').empty().prop('disabled', true);
                    $('#idUbicacionDestino').append('<option value="">Seleccione una ubicación</option>');
                }
            });
            
            // Cargar lotes cuando se selecciona un producto
            $('#idProducto').change(function() {
                const productoId = $(this).val();
                if (productoId) {
                    $.getJSON('/inventario/api/lotes/' + productoId, function(data) {
                        const loteSelect = $('#idLote');
                        loteSelect.empty();
                        loteSelect.append('<option value="">Seleccione un lote</option>');
                        
                        $.each(data, function(index, lote) {
                            let textoLote = lote.numeroLote;
                            if (lote.fechaCaducidad) {
                                const fecha = new Date(lote.fechaCaducidad);
                                textoLote += ' (Cad: ' + fecha.toLocaleDateString() + ')';
                            }
                            loteSelect.append('<option value="' + lote.id + '">' + textoLote + '</option>');
                        });
                        
                        loteSelect.prop('disabled', false);
                    });
                } else {
                    $('#idLote').empty().prop('disabled', true);
                    $('#idLote').append('<option value="">Seleccione un lote</option>');
                }
                
                // Actualizar stock disponible
                actualizarStockDisponible();
            });
            
            // Función para actualizar el stock disponible
            function actualizarStockDisponible() {
                const productoId = $('#idProducto').val();
                const bodegaId = $('#idBodegaOrigen').val();
                
                if (productoId && bodegaId) {
                    // Aquí se haría una petición AJAX para obtener el stock disponible
                    // Por simplicidad, no implementamos la petición real
                    $('#stockDisponible span').text('Calculando...');
                    
                    // Simulación de petición
                    setTimeout(function() {
                        // Esto sería reemplazado por el resultado real de la petición
                        const stockDisponible = Math.floor(Math.random() * 100);
                        $('#stockDisponible span').text(stockDisponible);
                        
                        // Limitar la cantidad máxima
                        $('#cantidad').attr('max', stockDisponible);
                    }, 500);
                } else {
                    $('#stockDisponible span').text('-');
                }
            }
        });
    </script>
</body>
</html>
