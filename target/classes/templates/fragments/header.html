<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - StockMaster'">StockMaster</title>
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <!-- Estilo Corporativo -->
    <link th:href="@{/css/stockmaster-corporate.css}" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
</head>
<body>
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg corporate-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <i class="fas fa-boxes me-2"></i>StockMaster
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" 
                        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/products/list"><i class="fas fa-box me-1"></i>Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/inventario"><i class="fas fa-warehouse me-1"></i>Inventario</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="reportesDropdown" role="button" 
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-chart-bar me-1"></i>Reportes
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="reportesDropdown">
                                <li><a class="dropdown-item" href="/reports/inventory">Inventario Completo</a></li>
                                <li><a class="dropdown-item" href="/reports/by-category">Stock por Categoría</a></li>
                                <li><a class="dropdown-item" href="/reports/by-provider">Stock por Proveedor</a></li>
                                <li><a class="dropdown-item" href="/reports/low-stock">Productos con Bajo Stock</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="/reports/marketing">Estadísticas de Marketing</a></li>
                            </ul>
                        </li>
                        <li class="nav-item" th:if="${session.userRole == 'ADMIN'}">
                            <a class="nav-link" href="/admin/dashboard"><i class="fas fa-cogs me-1"></i>Administración</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <div class="dropdown">
                            <a class="btn btn-outline-light dropdown-toggle" href="#" role="button" id="userDropdown" 
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-user me-1"></i><span th:text="${session.userName}">Usuario</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                <li><a class="dropdown-item" href="/profile/edit"><i class="fas fa-user-edit me-1"></i>Editar Perfil</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Cerrar Sesión</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
