<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Categoría - StockMaster</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" th:href="@{/home}">StockMaster</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home}">Inicio</a>
                </li>
                <li class="nav-item" th:if="${canViewInventory}">
                    <a class="nav-link" th:href="@{/products}">Gestión de Inventario</a>
                </li>
                <li class="nav-item" th:if="${canViewReports}">
                    <a class="nav-link" th:href="@{/reports}">Reportes</a>
                </li>
                <li class="nav-item active" th:if="${isAdmin}">
                    <a class="nav-link" th:href="@{/admin}">Administración <span class="sr-only">(current)</span></a>
                </li>
            </ul>
            <form class="form-inline my-2 my-lg-0" th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light my-2 my-sm-0" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Editar Categoría</h1>
            <a th:href="@{/admin/categories}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver a Categorías
            </a>
        </div>
        
        <!-- Alertas -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        
        <!-- Formulario para editar categoría -->
        <div class="card">
            <div class="card-header bg-warning text-white">
                <h5 class="mb-0">Editar Categoría</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/categories/update}" method="post" th:object="${category}">
                    <input type="hidden" th:field="*{id}">
                    <div class="form-group">
                        <label for="id">ID de Categoría</label>
                        <input type="text" class="form-control" id="id" th:value="*{id}" disabled>
                        <small class="form-text text-muted">El ID no se puede modificar.</small>
                    </div>
                    <div class="form-group">
                        <label for="name">Nombre de Categoría *</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required placeholder="Ingrese el nombre de la categoría">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
