<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proveedores - StockMaster</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        .action-buttons .btn {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" th:href="@{/home}">StockMaster</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home}">Inicio</a>
                </li>
                <li class="nav-item" th:if="${canViewInventory}">
                    <a class="nav-link" th:href="@{/products}">Gestión de Inventario</a>
                </li>
                <li class="nav-item" th:if="${canViewReports}">
                    <a class="nav-link" th:href="@{/reports}">Reportes</a>
                </li>
                <li class="nav-item active" th:if="${isAdmin}">
                    <a class="nav-link" th:href="@{/admin}">Administración <span class="sr-only">(current)</span></a>
                </li>
            </ul>
            <form class="form-inline my-2 my-lg-0" th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light my-2 my-sm-0" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Gestión de Proveedores</h1>
            <a th:href="@{/admin}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver al Panel
            </a>
        </div>
        
        <!-- Alertas -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        
        <!-- Formulario para crear nuevo proveedor -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Nuevo Proveedor</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/providers/create}" method="post" th:object="${newProvider}">
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="id">ID de Proveedor (opcional)</label>
                            <input type="text" class="form-control" id="id" th:field="*{id}" placeholder="Se generará automáticamente si se deja vacío">
                            <small class="form-text text-muted">Si no se proporciona, se generará automáticamente.</small>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="name">Nombre de Proveedor *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required placeholder="Ingrese el nombre del proveedor">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="contact">Contacto</label>
                            <input type="text" class="form-control" id="contact" th:field="*{contact}" placeholder="Nombre o teléfono de contacto">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-plus-circle"></i> Crear Proveedor
                    </button>
                </form>
            </div>
        </div>
        
        <!-- Tabla de proveedores existentes -->
        <div class="card">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0">Proveedores Existentes</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="thead-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Contacto</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="provider : ${providers}">
                                <td th:text="${provider.id}"></td>
                                <td th:text="${provider.name}"></td>
                                <td th:text="${provider.contact != null ? provider.contact : '-'}"></td>
                                <td class="action-buttons">
                                    <a th:href="@{/admin/providers/edit/{id}(id=${provider.id})}" class="btn btn-sm btn-warning">
                                        <i class="fas fa-edit"></i> Editar
                                    </a>
                                    <a th:href="@{/admin/providers/delete/{id}(id=${provider.id})}" class="btn btn-sm btn-danger" 
                                       onclick="return confirm('¿Está seguro de que desea eliminar este proveedor? Esta acción no se puede deshacer.')">
                                        <i class="fas fa-trash-alt"></i> Eliminar
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${providers.empty}">
                                <td colspan="4" class="text-center">No hay proveedores disponibles</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
