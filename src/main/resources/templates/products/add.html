<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Añadir Producto - StockMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/stockmaster-theme.css}" rel="stylesheet">
</head>
<body>
    <!-- Barra de navegación -->
    <div th:replace="fragments/navigation :: main-nav"></div>

    <div class="container mt-5">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2><i class="fas fa-plus-circle me-2"></i>Añadir Nuevo Producto</h2>
                <p class="mb-0 lead">Ingrese la información del nuevo producto</p>
            </div>
            <a th:href="@{/products/list}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Volver a la Lista
            </a>
        </div>
        
        <div class="card mt-4">
            <div class="card-body">
                <form th:action="@{/products/create}" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Nombre del Producto*</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="description" class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="description" name="description">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="price" class="form-label">Precio*</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" class="form-control" id="price" name="price" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="categoryId" class="form-label">Categoría</label>
                            <select class="form-select" id="categoryId" name="categoryId">
                                <option value="">Seleccione una categoría</option>
                                <option th:each="category : ${categories}" 
                                        th:value="${category.id}" 
                                        th:text="${category.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="providerId" class="form-label">Proveedor</label>
                            <select class="form-select" id="providerId" name="providerId">
                                <option value="">Seleccione un proveedor</option>
                                <option th:each="provider : ${providers}" 
                                        th:value="${provider.id}" 
                                        th:text="${provider.name}"></option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="initialStock" class="form-label">Stock Inicial</label>
                            <input type="number" class="form-control" id="initialStock" name="initialStock" value="0">
                        </div>
                        <div class="col-md-4">
                            <label for="minStock" class="form-label">Stock Mínimo</label>
                            <input type="number" class="form-control" id="minStock" name="minStock" value="5">
                        </div>
                        <div class="col-md-4">
                            <label for="maxStock" class="form-label">Stock Máximo</label>
                            <input type="number" class="form-control" id="maxStock" name="maxStock" value="100">
                        </div>
                    </div>
                    
                    <div class="text-end mt-4">
                        <button type="reset" class="btn btn-secondary me-2">
                            <i class="fas fa-undo me-2"></i>Restablecer
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Guardar Producto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts básicos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</body>
</html>
