# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/datos_almacen?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - Configurado para usar base de datos existente
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Deshabilitar completamente la inicialización SQL
spring.sql.init.mode=never
spring.sql.init.enabled=false
spring.jpa.defer-datasource-initialization=false

# Server Configuration
server.port=8080

# Logging Configuration - Aumentado para depuración
logging.level.org.springframework=DEBUG
logging.level.com.example.transactional=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate=DEBUG
logging.level.org.springframework.data=DEBUG

# Configuración para reducir caché y mejorar rendimiento
spring.main.banner-mode=off
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Allow Bean Definition Overriding
spring.main.allow-bean-definition-overriding=true

# Thymeleaf Configuration - Optimizado para rendimiento
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.enabled=true
spring.thymeleaf.servlet.content-type=text/html
